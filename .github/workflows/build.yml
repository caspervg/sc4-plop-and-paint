name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  DLL_ARTIFACT_NAME: SC4PlopAndPaint-dll-${{ github.sha }}
  CLI_ARTIFACT_NAME: SC4PlopAndPaint-cli-${{ github.sha }}
  CLI_LINUX_ARTIFACT_NAME: SC4PlopAndPaint-cli-linux-${{ github.sha }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dll:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Fetch full vcpkg history
        shell: powershell
        run: |
          $isShallow = (git -C vendor/vcpkg rev-parse --is-shallow-repository).Trim()
          if ($isShallow -eq "true") {
            git -C vendor/vcpkg fetch --unshallow
          }

      - name: Bootstrap vcpkg
        run: |
          ./vendor/vcpkg/bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=${{ github.workspace }}/vendor/vcpkg" >> $env:GITHUB_ENV

      - name: Install vcpkg dependencies
        run: ./vendor/vcpkg/vcpkg.exe install --triplet x86-windows-static-md

      - name: Build sc4-render-services
        working-directory: vendor/sc4-render-services
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A Win32
          cmake --build build --config Release --target imgui --parallel

      - name: Build DLL
        run: |
          cmake --preset vs2022-win32-release
          cmake --build --preset vs2022-win32-release-build --target SC4PlopAndPaint --parallel

      - name: Generate SBOM for DLL (SPDX)
        uses: anchore/sbom-action@v0
        with:
          file: cmake-build-release-visual-studio/src/dll/Release/SC4PlopAndPaint.dll
          format: spdx-json
          output-file: SC4PlopAndPaint.spdx.json
          upload-artifact: false

      - name: Stage DLL artifacts
        shell: bash
        run: |
          mkdir -p staging-dll
          cp cmake-build-release-visual-studio/src/dll/Release/SC4PlopAndPaint.dll staging-dll/
          cp SC4PlopAndPaint.spdx.json staging-dll/

      - name: Upload raw DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DLL_ARTIFACT_NAME }}
          compression-level: 0
          path: staging-dll/

  build-cli:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Fetch full vcpkg history
        shell: powershell
        run: |
          $isShallow = (git -C vendor/vcpkg rev-parse --is-shallow-repository).Trim()
          if ($isShallow -eq "true") {
            git -C vendor/vcpkg fetch --unshallow
          }

      - name: Bootstrap vcpkg
        run: |
          ./vendor/vcpkg/bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=${{ github.workspace }}/vendor/vcpkg" >> $env:GITHUB_ENV

      - name: Install vcpkg dependencies
        run: ./vendor/vcpkg/vcpkg.exe install --triplet x64-windows-static

      - name: Build CLI
        run: |
          cmake --preset vs2022-x64-release
          cmake --build --preset vs2022-x64-release-build --target SC4PlopAndPaintCli --parallel

      - name: Smoke test CLI --version
        shell: powershell
        run: |
          $cliPath = Join-Path "${{ github.workspace }}" "cmake-build-release-visual-studio-x64\src\app\Release\SC4PlopAndPaintCli.exe"
          if (-not (Test-Path $cliPath)) {
            throw "CLI smoke test failed: missing executable at $cliPath"
          }

          & $cliPath --version
          if ($LASTEXITCODE -ne 0) {
            throw "CLI smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Generate SBOM for Cache Builder (SPDX)
        uses: anchore/sbom-action@v0
        with:
          file: cmake-build-release-visual-studio-x64/src/app/Release/SC4PlopAndPaintCli.exe
          format: spdx-json
          output-file: SC4PlopAndPaintCacheBuilder.spdx.json
          upload-artifact: false

      - name: Stage CLI artifacts
        shell: bash
        run: |
          mkdir -p staging-cli
          cp cmake-build-release-visual-studio-x64/src/app/Release/SC4PlopAndPaintCli.exe staging-cli/
          cp SC4PlopAndPaintCacheBuilder.spdx.json staging-cli/

      - name: Upload raw CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLI_ARTIFACT_NAME }}
          compression-level: 0
          path: staging-cli/

  build-cli-linux:
    runs-on: ubuntu-24.04
    # manylinux_2_28 (AlmaLinux 8: glibc 2.28, GCC 14) keeps the binary runnable on older distributions.
    container: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
            mesa-libGL-devel mesa-libGLU-devel zip unzip
          pipx install ninja
          # The workspace is owned by the runner user, not the container's root user.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Fetch full vcpkg history
        run: |
          if [ "$(git -C vendor/vcpkg rev-parse --is-shallow-repository)" = "true" ]; then
            git -C vendor/vcpkg fetch --unshallow
          fi

      - name: Bootstrap vcpkg
        run: |
          ./vendor/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vendor/vcpkg" >> "$GITHUB_ENV"

      - name: Install vcpkg dependencies
        run: ./vendor/vcpkg/vcpkg install --triplet x64-linux

      - name: Build CLI
        run: |
          cmake --preset linux-x64-release
          cmake --build --preset linux-x64-release-build --target SC4PlopAndPaintCli --parallel

      - name: Check binary portability
        run: |
          cli=cmake-build-release-linux/src/app/SC4PlopAndPaintCli
          ldd "$cli"
          newest_glibc=$(objdump -T "$cli" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "Newest required glibc symbol version: $newest_glibc"
          if [ "$(printf '%s\n' "$newest_glibc" GLIBC_2.28 | sort -V | tail -1)" != "GLIBC_2.28" ]; then
            echo "The cache builder requires a glibc newer than 2.28"
            exit 1
          fi
          if objdump -T "$cli" | grep -q 'GLIBCXX_'; then
            echo "The cache builder links libstdc++ dynamically; expected it to be static"
            exit 1
          fi

      - name: Assemble package
        run: |
          pkg=staging-cli-linux/SC4PlopAndPaintCacheBuilder
          mkdir -p "$pkg"
          install -m 755 cmake-build-release-linux/src/app/SC4PlopAndPaintCli "$pkg/SC4PlopAndPaintCacheBuilder"
          install -m 755 dist/linux/rebuild-cache.sh "$pkg/rebuild-cache.sh"
          cp vendor/sc4-properties/new_properties.xml "$pkg/PropertyMapper.xml"
          cp dist/linux/README.txt LICENSE.txt dist/THIRD_PARTY_NOTICES.txt "$pkg/"

      - name: Smoke test packaged CLI
        run: |
          cli="$GITHUB_WORKSPACE/staging-cli-linux/SC4PlopAndPaintCacheBuilder/SC4PlopAndPaintCacheBuilder"
          "$cli" --version

          # Fake Wine prefix with lowercase folder names; run from another directory so
          # PropertyMapper.xml has to be found next to the executable.
          prefix=$(mktemp -d)
          game="$prefix/drive_c/Program Files (x86)/SimCity 4 Deluxe Edition"
          mkdir -p "$game/apps" "$prefix/drive_c/users/steamuser/Documents/SimCity 4/Plugins"
          touch "$game/apps/simcity 4.exe"
          cd "$(mktemp -d)"
          "$cli" --scan --wine-prefix "$prefix" | tee scan.log
          grep -F "Game Root: $game" scan.log
          grep -F "User Plugins: $prefix/drive_c/users/steamuser/Documents/SimCity 4/Plugins" scan.log
          grep -F "Loaded property mapper from" scan.log

      - name: Generate SBOM for Linux Cache Builder (SPDX)
        uses: anchore/sbom-action@v0
        with:
          file: staging-cli-linux/SC4PlopAndPaintCacheBuilder/SC4PlopAndPaintCacheBuilder
          format: spdx-json
          output-file: staging-cli-linux/SC4PlopAndPaintCacheBuilder-linux.spdx.json
          upload-artifact: false

      - name: Create archive
        run: |
          # Archived here so the executable bits survive the artifact upload.
          tar -C staging-cli-linux -czf staging-cli-linux/SC4PlopAndPaintCacheBuilder-linux-x64.tar.gz SC4PlopAndPaintCacheBuilder

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLI_LINUX_ARTIFACT_NAME }}
          compression-level: 0
          path: |
            staging-cli-linux/SC4PlopAndPaintCacheBuilder-linux-x64.tar.gz
            staging-cli-linux/SC4PlopAndPaintCacheBuilder-linux.spdx.json

  package-installer:
    needs: [build-dll, build-cli]
    runs-on: windows-2022
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Download DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DLL_ARTIFACT_NAME }}
          path: artifacts/dll

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLI_ARTIFACT_NAME }}
          path: artifacts/cli

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p dist-package

          cp artifacts/dll/SC4PlopAndPaint.dll dist-package/SC4PlopAndPaint.dll
          cp artifacts/dll/SC4PlopAndPaint.spdx.json dist-package/SC4PlopAndPaint.spdx.json
          cp artifacts/cli/SC4PlopAndPaintCli.exe dist-package/_SC4PlopAndPaintCacheBuilder.exe
          cp artifacts/cli/SC4PlopAndPaintCacheBuilder.spdx.json dist-package/SC4PlopAndPaintCacheBuilder.spdx.json

          cp dist/README.txt dist-package/
          cp dist/RUN_CACHE_BUILDER.cmd dist-package/
          cp LICENSE.txt dist-package/
          cp dist/THIRD_PARTY_NOTICES.txt dist-package/
          cp dist/SC4PlopAndPaintInstaller.nsi dist-package/
          cp dist/SC4PlopAndPaint.ini dist-package/
          cp dist/SC4PlopAndPaint.dat dist-package/
          [ -f vendor/sc4-properties/new_properties.xml ] && cp vendor/sc4-properties/new_properties.xml dist-package/PropertyMapper.xml

          echo "Package contents:"
          find dist-package -type f | sort

      - name: Set artifact name
        shell: bash
        run: echo "INSTALLER_ARTIFACT_NAME=SC4PlopAndPaint-$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        shell: powershell
        run: |
          $rootDir = "${{ github.workspace }}"
          $refName = "${{ github.ref_name }}"
          $version = if ($refName -match '^v(.+)') { $Matches[1] } else { "${{ github.sha }}".Substring(0, 7) }
          $minRenderServicesVersionPath = Join-Path $rootDir "dist\MIN_SC4_RENDER_SERVICES.txt"
          $minRenderServicesVersion = (Get-Content -Path $minRenderServicesVersionPath -Raw).Trim()
          if ($minRenderServicesVersion -notmatch '^v?(\d+)\.(\d+)\.(\d+)$') {
            throw "Invalid SC4 Render Services minimum version in ${minRenderServicesVersionPath}: '$minRenderServicesVersion'"
          }
          $minRenderServicesMajor = $Matches[1]
          $minRenderServicesMinor = $Matches[2]
          $minRenderServicesBuild = $Matches[3]
          Write-Host "Building installer for version: $version"
          Write-Host "Minimum SC4 Render Services version: $minRenderServicesMajor.$minRenderServicesMinor.$minRenderServicesBuild"
          Set-Location dist-package
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DAPP_VERSION=$version `
            /DMIN_RENDER_SERVICES_VERSION_MAJOR=$minRenderServicesMajor `
            /DMIN_RENDER_SERVICES_VERSION_MINOR=$minRenderServicesMinor `
            /DMIN_RENDER_SERVICES_VERSION_BUILD=$minRenderServicesBuild `
            SC4PlopAndPaintInstaller.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Write-Host "Installer contents:"
          Get-ChildItem -Filter "*.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INSTALLER_ARTIFACT_NAME }}
          compression-level: 0
          path: dist-package/

  validate-tag:
    name: Validate Release Tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate version tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH, for example v1.0.0. Got: $TAG_NAME"
            exit 1
          fi

  release:
    needs: [package-installer, build-cli-linux, validate-tag]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SC4PlopAndPaint-${{ github.ref_name }}
          path: dist-package

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLI_LINUX_ARTIFACT_NAME }}
          path: dist-linux

      - name: Name Linux cache builder archive
        run: |
          mv dist-linux/SC4PlopAndPaintCacheBuilder-linux-x64.tar.gz \
            "dist-linux/SC4PlopAndPaintCacheBuilder-${{ github.ref_name }}-linux-x64.tar.gz"

      - name: Create release zip
        run: |
          VERSION=${{ github.ref_name }}
          zip -j SC4PlopAndPaint-${VERSION}.zip \
            dist-package/SC4PlopAndPaint-*.exe \
            dist-package/README.txt \
            dist-package/LICENSE.txt \
            dist-package/THIRD_PARTY_NOTICES.txt \
            dist-package/SC4PlopAndPaint.spdx.json \
            dist-package/SC4PlopAndPaintCacheBuilder.spdx.json

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            SC4PlopAndPaint-${{ github.ref_name }}.zip
            dist-linux/SC4PlopAndPaintCacheBuilder-${{ github.ref_name }}-linux-x64.tar.gz
            dist-package/SC4PlopAndPaint.spdx.json
            dist-package/SC4PlopAndPaintCacheBuilder.spdx.json
            dist-linux/SC4PlopAndPaintCacheBuilder-linux.spdx.json
          generate_release_notes: true
